<!DOCTYPE html>
<html>
<head>
    <title>Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-card">

<h1>Enter Your Details</h1>

<form action="/predict" method="POST">

<input type="number" name="screen_time" placeholder="Screen Time (Hours)" required>

<input type="number" name="app_opens" placeholder="App Opens Per Day" required>

<input type="number" name="sleep_hours" placeholder="Sleep Hours" required>

<input type="number" name="study_hours" placeholder="Study Hours" required>

<input type="number" name="mood_level" placeholder="Mood Level (1-10)" required>

<button type="submit">
Analyze My Addiction
</button>

</form>

</div>

</body>
</html>
